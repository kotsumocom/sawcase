<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>認証画面デモ — Sawcase</title>
  <link rel="stylesheet" href="/dist/sawcase.css">
</head>
<body>

<div class="sc-auth">
  <div class="sc-auth__card">
    <div class="sc-auth__header">
      <div style="width:48px;height:48px;background:#6750a4;border-radius:12px;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:1.25rem;margin:0 auto 16px;">M</div>
      <h1 class="sc-auth__title">ログイン</h1>
    </div>
    <div class="sc-auth__body">
      <div style="margin-bottom: 16px;">
        <label style="display:block;font-size:0.875rem;font-weight:500;margin-bottom:4px;color:#49454f;">メールアドレス</label>
        <input type="email" placeholder="user@example.com" style="width:100%;padding:10px 12px;border:1px solid #cac4d0;border-radius:8px;font-size:0.875rem;box-sizing:border-box;">
      </div>
      <div style="margin-bottom: 16px;">
        <label style="display:block;font-size:0.875rem;font-weight:500;margin-bottom:4px;color:#49454f;">パスワード</label>
        <input type="password" placeholder="••••••••" style="width:100%;padding:10px 12px;border:1px solid #cac4d0;border-radius:8px;font-size:0.875rem;box-sizing:border-box;">
      </div>
      <button style="width:100%;padding:12px;background:#6750a4;color:white;border:none;border-radius:8px;font-size:0.875rem;font-weight:600;cursor:pointer;">ログイン</button>
    </div>
    <div class="sc-auth__footer">
      アカウントをお持ちでない方は <a href="#">新規登録</a>
    </div>
  </div>
</div>

</body>
</html>
